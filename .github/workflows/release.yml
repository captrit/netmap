name: Release NetMap Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Multi-Platform Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: netmap-linux-x86_64
            asset_name: NetMap-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: netmap-macos-x86_64
            asset_name: NetMap-${{ github.ref_name }}-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: netmap-windows-x86_64
            asset_name: NetMap-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Rust Scanner Engine
        run: |
          cd scanner
          cargo build --release --target ${{ matrix.target }}

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Package Linux/macOS Release
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_package
          cp -r backend release_package/
          cp -r frontend/dist release_package/frontend/
          cp scanner/target/${{ matrix.target }}/release/netmap-scanner release_package/
          cp start_netmap.sh update.sh VERSION README.md LICENSE release_package/
          tar -czvf ${{ matrix.asset_name }} -C release_package .

      - name: Package Windows Release
        if: runner.os == 'Windows'
        run: |
          mkdir release_package
          xcopy backend release_package\backend /E /I
          xcopy frontend\dist release_package\frontend\dist /E /I
          copy scanner\target\${{ matrix.target }}\release\netmap-scanner.exe release_package\
          copy update.ps1 release_package\
          copy VERSION release_package\
          copy README.md release_package\
          copy LICENSE release_package\
          Compress-Archive -Path release_package\* -DestinationPath ${{ matrix.asset_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
